name: Build and Deploy to Cloud Run

on:
  push:
    branches:
    - patient-centric-workflow

    paths:
    - core-server/**
  workflow_dispatch:

env:
  PROJECT_ID: awaz-e-sehat
  REPOSITORY: aes-patient-flow
  IMAGE_NAME: core-server-patient-flow
  BUILD_DIR: core-server
  REGION: asia-southeast1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Configure Docker for Google Artifact Registry
      run: |
        gcloud auth configure-docker $REGION-docker.pkg.dev


    - name: Build Docker image
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:$SHORT_SHA $BUILD_DIR

    - name: Push Docker image
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:$SHORT_SHA

    - name: Deploy to Cloud Run
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        SERVICE_NAME=core-server-${{ github.ref_name }}
        gcloud run deploy $SERVICE_NAME \
          --image $REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME:$SHORT_SHA \
          --region $REGION \
          --platform managed \
          --service-account cicdpipeline@awaz-e-sehat.iam.gserviceaccount.com \
          --allow-unauthenticated
